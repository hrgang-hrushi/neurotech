[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-morse"
version = "0.1.0"
description = "EEG (ANT Neuro eego) movement signals -> Morse dots/dashes -> English"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=1.5", "matplotlib>=3.6"]

[project.optional-dependencies]
eego = ["mne>=1.9", "antio"]     # read eego .cnt files
live = ["pylsl>=1.16"]           # decode eego's LSL stream in real time
xdf = ["pyxdf"]                  # read LabRecorder .xdf files
dev = ["pytest"]
all = ["mne>=1.9", "antio", "pylsl>=1.16", "pyxdf", "pytest"]

[project.scripts]
eeg-morse = "eeg_morse.__main__:main"

[tool.setuptools]
packages = ["eeg_morse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:channels not found"]

[project]
name = "eegmove"
version = "0.1.0"
description = "ANT Neuro eego EEG over LSL: real-time movement decoding (eegmove) and movement Morse (eeg_morse)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
    "antio>=0.5",
    "fastapi>=0.115",
    "matplotlib>=3.6",
    "mne>=1.9",
    "numpy>=1.26",
    "pandas>=1.5",
    "pylsl>=1.17",
    "python-multipart>=0.0.9",
    "scipy>=1.13",
    "uvicorn>=0.30",
    "wordfreq>=3.1.1",
]

[project.optional-dependencies]
xdf = ["pyxdf"]                  # read LabRecorder .xdf files (eeg_morse)
# eegmove's decoders. torch is ~600 MB (~5 GB with CUDA on Linux), so it stays out
# of hosted deploys of the eeg_morse decoder. Locally: `uv sync --all-extras`.
eegmove = ["braindecode>=1.2", "joblib>=1.4", "pyriemann>=0.8", "scikit-learn>=1.5", "torch>=2.4"]
all = ["pyxdf", "pytest>=8"]     # pip install -e ".[all]"

[project.scripts]
eegmove = "eegmove.cli:main"
eeg-morse = "eeg_morse.__main__:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eegmove", "eeg_morse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:channels not found"]

[project]
name = "eegmove"
version = "0.1.0"
description = "Real-time movement decoding from ANT Neuro eego EEG over LSL"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "antio>=0.5",
    "braindecode>=1.2",
    "joblib>=1.4",
    "mne>=1.9",
    "numpy>=1.26",
    "pylsl>=1.17",
    "pyriemann>=0.8",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "torch>=2.4",
]

[project.scripts]
eegmove = "eegmove.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eegmove"]

[tool.pytest.ini_options]
testpaths = ["tests"]
